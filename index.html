<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="トラップ レベル">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14121a">
<title>トラップ レベル | TRAP LEVEL</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#120f19;--ink:#f6f1e7;--mute:#a29bb3;--line:rgba(255,255,255,.14);--acc:#ff9f43;--acc2:#ffd27a;--red:#ff5a4d;--glass:rgba(24,20,34,.62);
 --disp:"Noto Sans JP","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
 --sans:"Noto Sans JP","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;--ts:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:700;overflow:hidden;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#000}
button{font-family:inherit;cursor:pointer;color:inherit}
svg{display:block}
/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;display:none;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 8px calc(14px + env(safe-area-inset-left));pointer-events:none;z-index:8}
#hud.on{display:flex;animation:dropIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.badge{display:flex;align-items:center;gap:10px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid var(--line);border-radius:14px;padding:6px 14px 6px 8px}
.badge b{font:900 20px var(--disp);color:#fff;background:var(--wc,#e98b3f);border-radius:9px;padding:3px 10px;text-shadow:0 2px 0 rgba(0,0,0,.3);letter-spacing:.04em}
.badge span{font:900 15px var(--sans);color:#fff;letter-spacing:.06em}
.miss{display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid var(--line);border-radius:14px;padding:7px 13px;font:900 14px var(--sans);color:#fff}
.miss svg{width:16px;height:16px;fill:var(--red)}
.miss small{opacity:.7;font-weight:700;font-size:12px}
#hud .sp{flex:1}
.ib{pointer-events:auto;width:44px;height:44px;border-radius:13px;border:1.5px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s}
.ib:active{transform:scale(.9)}.ib:hover{background:rgba(255,255,255,.16)}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib.pop{animation:pulse 1.4s ease-in-out infinite;border-color:var(--acc2)}
#hintBar{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-10px);max-width:min(680px,92vw);background:rgba(18,15,25,.92);border:2px solid var(--acc);color:#fff;padding:11px 20px;border-radius:14px;font:700 15px/1.7 var(--sans);opacity:0;pointer-events:none;z-index:9;text-align:center;transition:all .3s}
#hintBar.on{opacity:1;transform:translateX(-50%)}
#hintBar i{font-style:normal;color:var(--acc2);font-weight:900;margin-right:6px}
/* intro card */
#intro{position:fixed;left:0;right:0;top:36%;display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:7;opacity:0}
#intro b{font:900 clamp(44px,9vw,92px) var(--disp);color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.28);letter-spacing:.04em;line-height:1}
#intro span{font:900 clamp(18px,3.2vw,30px) var(--sans);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3);margin-top:10px;letter-spacing:.12em;background:rgba(18,15,25,.45);padding:4px 18px;border-radius:30px}
#intro.go{animation:intro 1.7s cubic-bezier(.2,.8,.2,1) both}
@keyframes intro{0%{opacity:0;transform:translateY(24px) scale(.9)}18%{opacity:1;transform:none}72%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-18px)}}
/* door wipe */
#doorsT{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex}
#doorsT i{flex:1;background:linear-gradient(180deg,#2b2236,#17121f);transform:translateX(0);transition:transform .38s cubic-bezier(.7,0,.3,1);position:relative}
#doorsT i.l{transform:translateX(-101%);border-right:4px solid #ffd27a}#doorsT i.r{transform:translateX(101%);border-left:4px solid #ffd27a}
#doorsT.closed i.l,#doorsT.closed i.r{transform:none}
#doorsT i::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#ffd27a;box-shadow:0 0 18px #ffd27a}
#doorsT i.l::after{right:20px}#doorsT i.r::after{left:20px}
/* ---------- touch controls ---------- */
#touch,#stickWrap{position:fixed;left:0;right:0;bottom:0;display:none;pointer-events:none;z-index:7;padding:0 calc(22px + env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) calc(22px + env(safe-area-inset-left))}
#touch.on{display:flex;justify-content:space-between;align-items:flex-end}
#touch.flip{flex-direction:row-reverse}
#touch .g{display:flex;gap:calc(14px*var(--ts));pointer-events:auto}
.tb{width:calc(96px*var(--ts));height:calc(96px*var(--ts));border-radius:50%;border:3px solid rgba(255,255,255,.8);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.28),rgba(24,20,34,.5));display:flex;align-items:center;justify-content:center;touch-action:none;transition:transform .08s,background .15s;box-shadow:0 6px 0 rgba(0,0,0,.28)}
.tb.on{transform:translateY(4px) scale(.96);background:radial-gradient(circle at 35% 30%,#ffd27a,rgba(255,159,67,.85));box-shadow:0 2px 0 rgba(0,0,0,.28)}
.tb svg{width:calc(44px*var(--ts));height:calc(44px*var(--ts));fill:#fff;pointer-events:none}
.tb.big{width:calc(118px*var(--ts));height:calc(118px*var(--ts))}
#stickWrap.on{display:flex;justify-content:space-between;align-items:flex-end}
#stickWrap.flip{flex-direction:row-reverse}
.stick{width:calc(170px*var(--ts));height:calc(170px*var(--ts));border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(24,20,34,.45);position:relative;pointer-events:auto;touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd27a);box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .06s}
.stick::before,.stick::after{content:"";position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-top:3px solid rgba(255,255,255,.7);border-left:3px solid rgba(255,255,255,.7)}
.stick::before{left:12px;transform:rotate(-45deg)}.stick::after{right:12px;transform:rotate(135deg)}
#free{position:fixed;inset:0;display:none;z-index:6;touch-action:none}
#free.on{display:block}
.fbase{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(24,20,34,.35);display:none;pointer-events:none}
.fbase i{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd27a)}
.fhint{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font:700 13px var(--sans);color:rgba(255,255,255,.7);pointer-events:none;z-index:6;display:none}
.fhint.on{display:block}
/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:flex-start;flex-direction:column;padding:calc(22px + env(safe-area-inset-top)) 20px calc(22px + env(safe-area-inset-bottom));z-index:20;background:radial-gradient(60rem 36rem at 50% -8%,#34294a,transparent 70%),radial-gradient(50rem 30rem at 90% 110%,#3a1f2e,transparent 70%),#0e0b14;overflow:auto;touch-action:pan-y}
.screen::before{content:"";position:fixed;inset:0;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 46px);pointer-events:none}
.screen.on{display:flex;animation:fade .35s ease both}
.screen>*{position:relative;margin-left:auto;margin-right:auto}
.screen.on>*{animation:rise .55s cubic-bezier(.2,.9,.3,1) both}
.screen.on>*:nth-child(2){animation-delay:.05s}.screen.on>*:nth-child(3){animation-delay:.1s}.screen.on>*:nth-child(4){animation-delay:.15s}.screen.on>*:nth-child(5){animation-delay:.2s}.screen.on>*:nth-child(6){animation-delay:.25s}
.center{justify-content:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes dropIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,210,122,.55)}50%{box-shadow:0 0 0 8px rgba(255,210,122,0)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes popSp{0%,100%{transform:translateY(8px) scaleY(.5)}45%,70%{transform:none}}
body.calm *{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01s!important}
.logo{font:900 clamp(44px,10vw,104px)/1.02 var(--disp);letter-spacing:.02em;text-align:center;margin:6px 0 0;text-shadow:0 6px 0 rgba(0,0,0,.4)}
.logo span{color:var(--acc);display:inline-block}
.logo em{font-style:normal;display:inline-block;animation:bob 3.2s ease-in-out infinite}
.logo2{font:900 clamp(12px,2.2vw,18px) var(--sans);letter-spacing:.6em;color:var(--mute);text-align:center;margin:10px 0 18px;padding-left:.6em}
.hero{width:min(560px,92vw);margin:0 auto 4px}
.hero svg{width:100%;height:auto;overflow:visible}
.hero .spk{animation:popSp 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.hero .chr{animation:bob 1.6s ease-in-out infinite}
.hero .blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.col{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(360px,100%)}
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:0;background:var(--ink);color:#1b1524;padding:16px 26px;font:900 20px var(--sans);letter-spacing:.2em;border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.4);transition:transform .12s,box-shadow .12s,filter .2s;position:relative;overflow:hidden}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn svg{width:22px;height:22px;fill:currentColor}
.btn.acc{background:linear-gradient(180deg,#ffbd6e,var(--acc));color:#2a1606}
.btn.acc::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn.ghost{background:var(--glass);color:var(--ink);border:1.5px solid var(--line);font-size:16px;padding:13px 22px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.btn.sm{width:auto;min-width:160px}
.ver{font:500 12px ui-monospace,monospace;color:var(--mute);margin-top:22px;text-align:center;letter-spacing:.06em}
h2{font:900 clamp(26px,5vw,38px) var(--disp);margin:6px 0 4px;text-align:center;letter-spacing:.06em;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.sub{color:var(--mute);font-size:14px;margin:0 0 20px;text-align:center;font-weight:700}
.wgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;width:min(1000px,100%)}
@media(max-width:860px){.wgrid{grid-template-columns:repeat(2,1fr)}}
.wc{border:0;border-radius:18px;padding:0 0 12px;color:#fff;text-align:center;position:relative;background:var(--wc);box-shadow:0 7px 0 rgba(0,0,0,.4),inset 0 0 0 2px rgba(255,255,255,.18);transition:transform .15s,box-shadow .15s;overflow:hidden;animation:rise .55s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(min(var(--i),14)*.04s)}
.wc:hover{transform:translateY(-4px) rotate(-.6deg)}.wc:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.4)}
.wc .art{width:100%;aspect-ratio:8/5;overflow:hidden}.wc .art svg{width:100%;height:100%}
.wc .no{position:absolute;left:10px;top:8px;font:900 22px var(--disp);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.wc b{display:block;font:900 16px var(--sans);text-shadow:0 2px 0 rgba(0,0,0,.35);margin-top:8px;letter-spacing:.05em}
.wc .dots{display:flex;gap:5px;justify-content:center;margin-top:8px}
.wc .dots u{width:13px;height:13px;border-radius:50%;background:rgba(0,0,0,.32);display:block}
.wc .dots u.d{background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8)}.wc .dots u.s{background:#ffd27a}
.wc.done::after{content:"制覇";position:absolute;right:-26px;top:12px;transform:rotate(40deg);background:#ffd27a;color:#3a2506;font:900 12px var(--sans);padding:2px 30px;letter-spacing:.1em}
.stl{display:flex;flex-direction:column;gap:12px;width:min(640px,100%)}
.st{display:flex;align-items:center;gap:14px;padding:10px 16px 10px 10px;border:1.5px solid var(--line);background:var(--glass);color:var(--ink);border-radius:16px;text-align:left;font:900 18px var(--sans);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .14s,border-color .2s;animation:rise .5s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i)*.06s)}
.st:hover{transform:translateX(6px);border-color:var(--wc)}.st:active{transform:scale(.98)}
.st img{width:128px;height:72px;border-radius:9px;object-fit:cover;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.st em{font:900 20px var(--disp);font-style:normal;color:var(--wc);min-width:48px}
.st span{flex:1;letter-spacing:.04em}.st small{color:var(--mute);font-size:12px;font-weight:700;text-align:right;line-height:1.5}
.st.done{border-color:rgba(88,194,125,.7)}
.st .ck{width:26px;height:26px;fill:none;stroke:#58c27d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* settings */
.sbox{width:min(620px,100%);display:flex;flex-direction:column;gap:12px}
.sec{background:var(--glass);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sec h3{margin:0 0 10px;font:900 13px var(--sans);letter-spacing:.2em;color:var(--acc2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font:900 16px var(--sans)}
.row+.row{border-top:1px solid var(--line)}
.row small{display:block;color:var(--mute);font-weight:700;font-size:12px;margin-top:2px}
.sw{width:58px;height:32px;border-radius:20px;border:0;background:#4a4458;position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.3,1.5,.5,1);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.sw.on{background:#58c27d}.sw.on::after{transform:translateX(26px)}
.seg{display:flex;background:rgba(0,0,0,.3);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font:900 14px var(--sans);color:var(--mute);transition:background .2s,color .2s}
.seg button.on{background:var(--acc);color:#2a1606}
input[type=range]{-webkit-appearance:none;appearance:none;width:170px;height:8px;border-radius:6px;background:rgba(255,255,255,.18);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--acc2));box-shadow:0 3px 0 rgba(0,0,0,.35)}
.sel{position:relative;flex:none;min-width:230px}
.sel>button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:rgba(0,0,0,.3);font:900 15px var(--sans);text-align:left;transition:border-color .2s}
.sel>button:hover,.sel.open>button{border-color:var(--acc)}
.sel>button svg.i{width:26px;height:26px;fill:var(--acc2);flex:none}
.sel>button span{flex:1}
.sel>button svg.ch{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.sel.open>button svg.ch{transform:rotate(180deg)}
.sel ul{list-style:none;margin:6px 0 0;padding:6px;position:absolute;right:0;left:0;top:100%;background:#241d33;border:1.5px solid var(--acc);border-radius:14px;z-index:5;box-shadow:0 16px 30px rgba(0,0,0,.5);transform-origin:top;transform:scaleY(.7) translateY(-8px);opacity:0;pointer-events:none;transition:transform .22s cubic-bezier(.2,.9,.3,1.2),opacity .18s}
.sel.open ul{transform:none;opacity:1;pointer-events:auto}
.sel li{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:9px;font:900 15px var(--sans);cursor:pointer}
.sel li svg{width:24px;height:24px;fill:var(--acc2);flex:none}
.sel li small{display:block;color:var(--mute);font-weight:700;font-size:11px}
.sel li:hover{background:rgba(255,255,255,.1)}.sel li.on{background:rgba(255,159,67,.22)}
.pad{font:700 12px var(--sans);color:var(--mute)}.pad b{color:#58c27d}
.danger{background:#5a2a2e;color:#ffd0cc;border:0;border-radius:10px;padding:9px 16px;font:900 14px var(--sans)}
.banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.8);background:linear-gradient(180deg,#2d2340,#1a1424);border:3px solid var(--acc);padding:18px 40px;border-radius:20px;font:900 34px var(--disp);letter-spacing:.1em;z-index:40;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,1.3,.4,1);text-align:center;box-shadow:0 14px 0 rgba(0,0,0,.35)}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:21}
.conf i{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="hud">
  <div class="badge" id="hBadge"><b id="hNo"></b><span id="hName"></span></div>
  <div class="miss"><svg viewBox="0 0 24 24"><path d="M12 2l3 7 7 1-5.5 5 1.7 7.5L12 18.5 5.8 22.5 7.5 15 2 10l7-1z"/></svg><span id="hMs"></span></div>
  <div class="sp"></div>
  <button class="ib" id="hHint" style="display:none" aria-label="ヒント"><svg viewBox="0 0 24 24"><path d="M9 21h6M10 17.5h4M12 3a6 6 0 00-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0012 3z"/></svg></button>
  <button class="ib" id="hSkip" style="display:none" aria-label="スキップ"><svg viewBox="0 0 24 24"><path d="M5 5l8 7-8 7zM15 5v14M19 5v14"/></svg></button>
  <button class="ib" id="hRe" aria-label="やり直し"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.6-5.9M20 4v5h-5"/></svg></button>
  <button class="ib" id="hMenu" aria-label="メニュー"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
</div>
<div id="hintBar"></div>
<div id="intro"><b id="inNo"></b><span id="inName"></span></div>
<div class="banner" id="banner"></div>
<div id="doorsT"><i class="l"></i><i class="r"></i></div>

  if(S.jb>0&&S.coy>0){ if(S.fj){ p.g*=-1; p.on=false; p.vy=-2*p.g; } else p.vy=-JV*S.js*p.g; S.coy=0; S.jb=0; S.jc++; S.sj=S.f; S.cj=true; }
  if(S.cj&&!S.jh&&p.vy*p.g<-3.4) p.vy=-3.4*p.g;
  // y
  p.vy+=GR*S.gs*p.g+S.wy; if(p.vy*p.g>MAXF) p.vy=MAXF*p.g;
  const wasOn=p.on,pvy=p.vy; p.y+=p.vy; p.on=false; p.onCh="";
  { const rs=solidsAt(L,S,p.x,p.y,p.w,p.h); for(const r of rs){ if(!ov(p,r)) continue;
      if(p.vy*p.g>0){ p.y=p.g>0?r.y-p.h:r.y+r.h; p.vy=0; p.on=true; p.onCh=r.ch; p.ice=r.ice; }
      else { p.y=p.g>0?r.y+r.h:r.y-p.h; p.vy=0; } } }
  if(p.on){ S.coy=6; S.cj=false; if(!wasOn&&pvy*p.g>2.5){ S.ld=S.f; S.lv=pvy; } }
  if(S.wrap){ if(p.x>W) p.x-=W+p.w; else if(p.x<-p.w) p.x+=W+p.w; }
  if(p.on&&Math.abs(p.vx)<.1&&!S.wind&&!cvg) S.idle++; else S.idle=0;
  // 範囲外
  if(p.y>H+30||p.y<-90||p.x<-40||p.x>W+40){ die(S,"fall"); return; }
  if(S.sc>0) S.sc--;
  // 危険・取得・扉
  const pr={x:p.x+2,y:p.y+2,w:p.w-4,h:p.h-4};
  for(const ch of L.gl){ const G=L.G[ch],g=S.g[ch]; if(!g.vis) continue;
    for(const c of G.cells){ const x=c[0]*TS+g.ox,y=c[1]*TS+g.oy;
      if(g.haz){ let r; if(G.k==="spike"){ r=G.d==="u"?{x:x+5,y:y+8,w:20,h:22}:G.d==="d"?{x:x+5,y:y,w:20,h:22}:G.d==="l"?{x:x,y:y+5,w:22,h:20}:{x:x+8,y:y+5,w:22,h:20}; if(ov(pr,r)){ die(S,"spike"); return; } }
        else { r={x:x-1.5,y:y-1.5,w:TS+3,h:TS+3}; if(ov({x:p.x,y:p.y,w:p.w,h:p.h},r)){ die(S,"hit"); return; } } }
      if(G.k==="spring"){ if(S.sc<=0&&ov(p,{x:x+2,y:y+14,w:26,h:16})){ p.vy=-SPRING*p.g; S.cj=false; S.sc=10; g.anim=10; S.sp=S.f; } }
      else if(G.k==="key"||G.k==="coin"){ if(ov(p,{x:x+4,y:y+4,w:22,h:22})){ g.vis=false; g.got=true; if(G.k==="key"&&!G.fake) S.key=true; S.pk=G.k; break; } }

    } }
}

function genParse(s){ const [m,e,o]=s.split("|"); return {m:m.split(",").map(t=>{ const [id,q]=t.split("."); return [id,+q||0]; }),e:e||"",o:o||""}; }
function genFn(rec){ return B=>{ let ci=0; const C=()=>POOL[ci++]; let x=4; for(const [id,q] of rec.m){ const m=MOT[id]; m.f(B,x,q,C); x+=m.w; } if(rec.e) ENDS[rec.e].f(B); if(rec.o) MODS[rec.o].f(B); }; }

const KB={l:false,r:false,j:false},TB={l:false,r:false,j:false},SK={l:false,r:false},FR={l:false,r:false,j:false};

function pollPad(){ GP.l=GP.r=GP.j=false; padName=""; try{ const pads=navigator.getGamepads?navigator.getGamepads():[]; for(const p of pads){ if(!p) continue; padName=p.id; const ax=p.axes[0]||0; if(ax<-.4||(p.buttons[14]&&p.buttons[14].pressed)) GP.l=true; if(ax>.4||(p.buttons[15]&&p.buttons[15].pressed)) GP.r=true; if([0,1,2,3,12].some(i=>p.buttons[i]&&p.buttons[i].pressed)) GP.j=true; if(p.buttons[9]&&p.buttons[9].pressed&&G.screen==="play"&&!pollPad.s){ pollPad.s=1; restart(); } else if(!(p.buttons[9]&&p.buttons[9].pressed)) pollPad.s=0; } }catch(e){} }
const keyMap={ArrowLeft:"l",KeyA:"l",ArrowRight:"r",KeyD:"r",ArrowUp:"j",KeyW:"j",Space:"j",KeyZ:"j"};
addEventListener("keydown",e=>{ const m=keyMap[e.code]; if(m){ KB[m]=true; if(G.screen==="play") e.preventDefault(); audio(); }
  if(G.screen==="play"){ if(e.code==="KeyR") restart(); if(e.code==="Escape") go("worlds"); if(G.deadT>0&&(m||e.code==="Enter")) G.deadT=1; } });
addEventListener("keyup",e=>{ const m=keyMap[e.code]; if(m) KB[m]=false; });
addEventListener("blur",()=>{ KB.l=KB.r=KB.j=false; });
function holdBtn(id,tgt,k){ const b=$("#"+id);
  const on=e=>{ e.preventDefault(); tgt[k]=true; b.classList.add("on"); audio(); try{b.setPointerCapture(e.pointerId)}catch(_){} };
  const off=e=>{ e.preventDefault(); tgt[k]=false; b.classList.remove("on"); };
  b.addEventListener("pointerdown",on); b.addEventListener("pointerup",off); b.addEventListener("pointercancel",off); b.addEventListener("lostpointercapture",off); b.addEventListener("contextmenu",e=>e.preventDefault()); }
holdBtn("bL",TB,"l"); holdBtn("bR",TB,"r"); holdBtn("bJ",TB,"j"); holdBtn("bJ2",TB,"j");
// 固定スティック
(()=>{ const st=$("#stick"),kn=$("#sknob"); let pid=null;
  const mv=e=>{ const r=st.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width/2; let dx=e.clientX-cx,dy=e.clientY-cy; const d=Math.hypot(dx,dy),m=R*.42; if(d>m){ dx*=m/d; dy*=m/d; } kn.style.transform=`translate(${dx}px,${dy}px)`; SK.l=dx<-R*.16; SK.r=dx>R*.16; };
  const end=()=>{ pid=null; SK.l=SK.r=false; kn.style.transform=""; };
  st.addEventListener("pointerdown",e=>{ e.preventDefault(); pid=e.pointerId; try{st.setPointerCapture(pid)}catch(_){} audio(); mv(e); });
  st.addEventListener("pointermove",e=>{ if(e.pointerId===pid) mv(e); });
  st.addEventListener("pointerup",end); st.addEventListener("pointercancel",end); st.addEventListener("lostpointercapture",end); })();
// フリー操作（左半分＝スティック／右半分＝ジャンプ）
(()=>{ const fr=$("#free"),fb=$("#fbase"),kn=$("#fknob"); let mp=null,jp=null,ox=0,oy=0;
  fr.addEventListener("pointerdown",e=>{ e.preventDefault(); audio(); if(e.clientX<innerWidth/2){ if(mp!==null) return; mp=e.pointerId; ox=e.clientX; oy=e.clientY; fb.style.display="block"; fb.style.left=ox+"px"; fb.style.top=oy+"px"; kn.style.transform=""; } else { jp=e.pointerId; FR.j=true; } try{fr.setPointerCapture(e.pointerId)}catch(_){} });
  fr.addEventListener("pointermove",e=>{ if(e.pointerId!==mp) return; let dx=e.clientX-ox,dy=e.clientY-oy; const d=Math.hypot(dx,dy),m=52; if(d>m){ dx*=m/d; dy*=m/d; } kn.style.transform=`translate(${dx}px,${dy}px)`; FR.l=e.clientX-ox<-16; FR.r=e.clientX-ox>16; if(e.clientY-oy<-60) FR.j=true; else if(jp===null) FR.j=false; });
  const up=e=>{ if(e.pointerId===mp){ mp=null; FR.l=FR.r=false; fb.style.display="none"; if(jp===null) FR.j=false; } if(e.pointerId===jp){ jp=null; FR.j=false; } };
  fr.addEventListener("pointerup",up); fr.addEventListener("pointercancel",up); })();
function getInp(){ return {l:KB.l||TB.l||GP.l||SK.l||FR.l,r:KB.r||TB.r||GP.r||SK.r||FR.r,j:KB.j||TB.j||GP.j||FR.j}; }
function ctlMode(){ return SET.ctl==="auto"?((("ontouchstart" in window)||navigator.maxTouchPoints>0)?"buttons":"off"):SET.ctl; }
function applyTouch(){ const m=ctlMode(),pl=G.screen==="play";
  document.documentElement.style.setProperty("--ts",SET.size); const fl=SET.side==="left";
  $("#touch").classList.toggle("on",pl&&m==="buttons"); $("#touch").classList.toggle("flip",fl);
  $("#stickWrap").classList.toggle("on",pl&&m==="stick"); $("#stickWrap").classList.toggle("flip",fl);
  $("#free").classList.toggle("on",pl&&m==="free"); $("#fhint").classList.toggle("on",pl&&m==="free");
  document.body.classList.toggle("calm",!!SET.calm); }

/* ---- 画面 ---- */
function showScreen(id){ document.querySelectorAll(".screen").forEach(e=>e.classList.remove("on")); if(id) $("#"+id).classList.add("on"); }
function go(id){ G.screen=id; if(id!=="play"){ $("#hud").classList.remove("on"); $("#hintBar").classList.remove("on"); $("#intro").classList.remove("go"); } showScreen(id); applyTouch();
  if(id==="worlds") buildWorlds(); if(id==="title") buildTitle(); if(id==="settings") buildSettings(); }
function clearedIn(w){ let n=0; for(let k=0;k<5;k++) if(SAVE.clear[(w-1)*5+k]) n++; return n; }
function nextLevel(){ if(typeof SAVE.last==="number"&&SAVE.last>=0&&SAVE.last<LV.length) return SAVE.last; for(let i=0;i<LV.length;i++) if(!SAVE.clear[i]) return i; return 0; }
function buildTitle(){ const n=Object.keys(SAVE.clear).length; $("#bPlayT").textContent=(n>0||SAVE.last>0)&&n<LV.length?"続きから　"+(Math.floor(nextLevel()/5)+1)+"-"+(nextLevel()%5+1):"遊ぶ"; $("#hero").innerHTML=heroSVG(); $("#ver").textContent=`v1.2.0　全${LV.length/5}ワールド・${LV.length}ステージ`; }
function buildWorlds(){
  const n=Object.keys(SAVE.clear).length; $("#wSub").textContent=`クリア ${n} / ${LV.length}　　失敗の合計 ${G.tot}回`;
  $("#wgrid").innerHTML=WORLDS.slice(0,LV.length/5).map((w,i)=>{ const dots=Array.from({length:5},(_,k)=>{ const o=SAVE.clear[i*5+k]; return `<u class="${o?(o.sk?"s":"d"):""}"></u>`; }).join(""); return `<button class="wc ${clearedIn(i+1)===5?"done":""}" data-w="${i+1}" style="--wc:${w.bg};--i:${i}"><div class="art">${worldArt(i)}</div><span class="no">${i+1}</span><b>${w.n}</b><div class="dots">${dots}</div></button>`; }).join("");
  $("#wgrid").querySelectorAll(".wc").forEach(b=>b.addEventListener("click",()=>{ audio(); buildStages(+b.dataset.w); go("stages"); }));
}
const CK=`<svg class="ck" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>`;
function buildStages(w){ G.world=w; $("#sTitle").textContent=`${w}. ${WORLDS[w-1].n}`; $("#sSub").textContent="挑戦するステージを選ぼう";
  $("#stl").innerHTML=Array.from({length:5},(_,k)=>{ const i=(w-1)*5+k,o=SAVE.clear[i]; return `<button class="st ${o?"done":""}" data-i="${i}" style="--wc:${WORLDS[w-1].bg};--i:${k}"><img alt="" src="${thumb(i)}"><em>${w}-${k+1}</em><span>${LV[i].n}</span><small>${o?(o.sk?"スキップ済み":"最少失敗 "+o.d+"回"):""}</small>${o?CK:""}</button>`; }).join("");
  $("#stl").querySelectorAll(".st").forEach(b=>b.addEventListener("click",()=>{ audio(); startLevel(+b.dataset.i); })); }

/* ---- 設定 ---- */
const CTLOPT=[{v:"auto",l:"自動",d:"端末に合わせる",ic:"auto"},{v:"buttons",l:"ボタン",d:"左右ボタン＋ジャンプ",ic:"buttons"},{v:"stick",l:"スティック",d:"固定の仮想スティック",ic:"stick"},{v:"free",l:"フリー操作",d:"左半分でスティック、右半分でジャンプ",ic:"free"},{v:"off",l:"キー・パッドのみ",d:"画面の操作は出さない",ic:"off"}];
const SIDEOPT=[{v:"right",l:"ジャンプを右",d:"右利き向け",ic:"right"},{v:"left",l:"ジャンプを左",d:"左利き向け",ic:"left"}];
function selHTML(key,opts){ const cur=opts.find(o=>o.v===SET[key])||opts[0];
  return `<div class="sel" data-k="${key}"><button type="button">${ICO[cur.ic]}<span>${cur.l}</span>${ICO.chev}</button><ul>${opts.map(o=>`<li data-v="${o.v}" class="${o.v===cur.v?"on":""}">${ICO[o.ic]}<div>${o.l}<small>${o.d}</small></div></li>`).join("")}</ul></div>`; }
function segHTML(key,opts){ return `<div class="seg" data-k="${key}">${opts.map(o=>`<button type="button" data-v="${o[0]}" class="${String(SET[key])===String(o[0])?"on":""}">${o[1]}</button>`).join("")}</div>`; }
function swHTML(key){ return `<button type="button" class="sw ${SET[key]?"on":""}" data-sw="${key}" aria-label="切り替え"></button>`; }
function buildSettings(){
  $("#sbox").innerHTML=`
  <div class="sec"><h3>操作方式</h3>
    <div class="row"><div>画面の操作<small>iPadなどのタッチ操作</small></div>${selHTML("ctl",CTLOPT)}</div>
    <div class="row"><div>ボタンの配置<small>ジャンプボタンを置く側</small></div>${selHTML("side",SIDEOPT)}</div>
    <div class="row"><div>ボタンの大きさ</div>${segHTML("size",[[.8,"小"],[1,"中"],[1.25,"大"]])}</div>
    <div class="row"><div>キーボード<small>← → / A D で移動　↑ / W / スペースでジャンプ　R でやり直し</small></div></div>
    <div class="row"><div>ゲームパッド<small>十字キー・左スティックで移動、Ａ・Ｂボタンでジャンプ、STARTでやり直し</small></div><span class="pad" id="padSt"></span></div>
  </div>
  <div class="sec"><h3>サウンド</h3>
    <div class="row"><div>効果音</div>${swHTML("snd")}</div>
    <div class="row"><div>音量</div><input type="range" id="vol" min="0" max="100" step="10" value="${Math.round(SET.vol*100)}"></div>
  </div>
  <div class="sec"><h3>演出</h3>
    <div class="row"><div>画面の揺れ<small>苦手なら切ってください</small></div>${swHTML("shk")}</div>
    <div class="row"><div>アニメーションを控えめに<small>背景の動き・ステージ切り替え演出などを減らす</small></div>${swHTML("calm")}</div>
  </div>
  <div class="sec"><h3>データ</h3>
    <div class="row"><div>引き継ぎ<small>ブラウザやアプリを変えるときは、コードを作って移そう</small></div><button type="button" class="danger" style="background:#ffd27a;color:#1b1524;border-color:#ffd27a" id="tExp">コードを作る</button></div>
    <div class="row" id="xfer" style="display:none;flex-direction:column;align-items:stretch;gap:8px"><textarea id="xcode" rows="4" style="width:100%;box-sizing:border-box;background:#120f19;color:#fff;border:1.5px solid rgba(255,255,255,.25);border-radius:10px;padding:8px;font:12px monospace" placeholder="ここにコードを貼り付け"></textarea><div style="display:flex;gap:8px"><button type="button" class="danger" style="flex:1;background:#ffd27a;color:#1b1524;border-color:#ffd27a" id="xCopy">コピー</button><button type="button" class="danger" style="flex:1" id="xLoad">このコードを読み込む</button></div><small id="xmsg"></small></div>
    <div class="row"><div>セーブデータ<small>クリア状況と失敗回数</small></div><button type="button" class="danger" id="tReset">消去する</button></div>
  </div>`;
  const box=$("#sbox");
  box.querySelectorAll(".sel").forEach(s=>{ s.querySelector("button").addEventListener("click",e=>{ e.stopPropagation(); const o=s.classList.contains("open"); box.querySelectorAll(".sel").forEach(x=>x.classList.remove("open")); if(!o) s.classList.add("open"); audio(); });
    s.querySelectorAll("li").forEach(li=>li.addEventListener("click",e=>{ e.stopPropagation(); SET[s.dataset.k]=li.dataset.v; saveSet(); applyTouch(); buildSettings(); })); });
  box.querySelectorAll(".seg").forEach(s=>s.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{ SET[s.dataset.k]=+b.dataset.v; saveSet(); applyTouch(); buildSettings(); })));
  box.querySelectorAll("[data-sw]").forEach(b=>b.addEventListener("click",()=>{ const k=b.dataset.sw; SET[k]=!SET[k]; saveSet(); applyTouch(); b.classList.toggle("on",SET[k]); audio(); if(k==="snd"&&SET.snd) SE.coin(); }));
  $("#vol").addEventListener("input",e=>{ SET.vol=e.target.value/100; saveSet(); }); $("#vol").addEventListener("change",()=>{ audio(); SE.coin(); });
  const enc=()=>{ const c={}; for(const k in SAVE.clear){ const o=SAVE.clear[k]; c[k]=[o.d,o.sk]; } return "TL1:"+btoa(unescape(encodeURIComponent(JSON.stringify({c,t:SAVE.deaths||0,l:SAVE.last||0})))); };
  const xm=t=>{ $("#xmsg").textContent=t; };
  $("#tExp").addEventListener("click",()=>{ $("#xfer").style.display="flex"; $("#xcode").value=enc(); xm("このコードを、移したい先の「このコードを読み込む」に貼り付けてね。"); });
  $("#xCopy").addEventListener("click",async()=>{ const t=$("#xcode"); t.select(); try{ await navigator.clipboard.writeText(t.value); xm("コピーしました！"); }catch(e){ document.execCommand&&document.execCommand("copy"); xm("コピーしました（できていなければ、長押しでコピー）"); } });
  $("#xLoad").addEventListener("click",()=>{ try{ let v=$("#xcode").value.trim(); if(!v.startsWith("TL1:")) throw 0; const j=JSON.parse(decodeURIComponent(escape(atob(v.slice(4))))); const clear={}; for(const k in j.c) clear[k]={d:j.c[k][0],sk:j.c[k][1]}; SAVE={clear,deaths:j.t|0,last:j.l|0}; G.tot=SAVE.deaths; saveAll(); xm("読み込みました！ タイトルに戻ると反映されます。"); }catch(e){ xm("コードが正しくありません。"); } });
  let arm=0; $("#tReset").addEventListener("click",e=>{ const b=e.target; if(arm){ SAVE={clear:{},deaths:0,last:0}; G.tot=0; saveAll(); arm=0; b.textContent="消去しました"; } else { arm=1; b.textContent="もう一度タップで消去"; setTimeout(()=>{ if(arm){ arm=0; b.textContent="消去する"; } },3000); } });
  updPad();
}
document.addEventListener("click",()=>{ document.querySelectorAll(".sel.open").forEach(x=>x.classList.remove("open")); });
function updPad(){ const e=$("#padSt"); if(!e) return; pollPad(); e.innerHTML=padName?`<b>接続中</b>`:"未接続（ボタンを押すと認識）"; }
addEventListener("gamepadconnected",updPad); addEventListener("gamepaddisconnected",updPad);

$("#bPlay").addEventListener("click",()=>{ audio(); startLevel(nextLevel()); });
$("#bWorlds").addEventListener("click",()=>{ audio(); go("worlds"); });
$("#bSet").addEventListener("click",()=>{ audio(); G.back="title"; go("settings"); });
$("#wBack").addEventListener("click",()=>go("title"));
$("#sBack").addEventListener("click",()=>go("worlds"));
$("#setBack").addEventListener("click",()=>go(G.back==="play"?"worlds":"title"));
$("#endBack").addEventListener("click",()=>go("worlds"));
$("#hRe").addEventListener("click",()=>{ if(G.screen==="play") restart(); });
$("#hMenu").addEventListener("click",()=>{ go("worlds"); });
$("#hHint").addEventListener("click",()=>{ const b=$("#hintBar"); b.innerHTML=`<i>ヒント</i>${L.h}`; b.classList.toggle("on"); updHUD(); });
$("#hSkip").addEventListener("click",()=>{ SAVE.clear[G.li]={d:G.lvDeaths,sk:1}; SAVE.last=Math.min(G.li+1,LV.length-1); saveAll(); afterWin(); });

/* ---- メインループ ---- */
let last=performance.now(),acc=0;
function tick(now){
  const dt=Math.min(100,now-last); last=now;
  if(G.screen==="play"&&L){
    acc+=dt; pollPad();
    while(acc>=1000/60){ acc-=1000/60; frame(); }
    draw();
  } else acc=0;
  requestAnimationFrame(tick);
}
function frame(){
  if(FX.flash>0) FX.flash--; if(FX.sqT>0) FX.sqT--;
  for(const q of FX.parts){ q.x+=q.vx; q.y+=q.vy; q.vy+=.35; }
  for(const q of FX.dust){ q.x+=q.vx; q.y+=q.vy; q.l--; } FX.dust=FX.dust.filter(q=>q.l>0);
  for(const q of FX.conf){ q.x+=q.vx; q.y+=q.vy; q.vy+=.28; q.vx*=.99; } FX.conf=FX.conf.filter(q=>q.y<H+30);
  if(S.st==="win"){ if(--G.winT<=0) afterWin(); return; }
  if(S.st==="dead"){ if(G.deadT===0){ G.deadT=26; } if(--G.deadT<=0){ restart(); } return; }
  const sj=S.sj,spr=S.sp,tk=S.tk,ld=S.ld; S.pk=""; const px=S.p.x,py=S.p.y; step(L,S,getInp());
  const p=S.p;
  if(S.sj!==sj&&S.sj===S.f){ SE.jump(); burstDust(p.x+p.w/2,p.g>0?p.y+p.h:p.y,5,2.4); FX.sq=.55; FX.sqT=4; }
  if(S.ld!==ld&&S.ld===S.f){ burstDust(p.x+p.w/2,p.g>0?p.y+p.h:p.y,7,3.4); FX.sq=Math.min(1,S.lv/9); FX.sqT=7; }
  if(p.on&&Math.abs(p.vx)>2&&S.f%9===0) burstDust(p.x+p.w/2,p.g>0?p.y+p.h:p.y,1,1.2);
  if(S.sp!==spr&&S.sp===S.f){ SE.spring(); burstDust(p.x+p.w/2,p.y+p.h,8,4); }
  if(S.tk!==tk&&S.tk===S.f) SE.tick(); if(S.pk) (S.pk==="key"?SE.key:SE.coin)();
  if(S.st==="dead") onDie(); else if(S.st==="win") onWin();
}
addEventListener("resize",fit); addEventListener("orientationchange",()=>setTimeout(fit,200));
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("gesturestart",e=>e.preventDefault());
fit(); buildTitle(); applyTouch(); requestAnimationFrame(tick);
window.__tl={LV,build,newState,step,TS,GW,GH,W,H,G,SET,startLevel,mkTest,MOT,ENDS,MODS,get S(){return S},get L(){return L}};
})();
</script>
